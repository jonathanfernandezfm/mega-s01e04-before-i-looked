# Plan morning-digest § 3/4, ADR 0003: the preview is built and deployed from an artifact,
# never committed. Run with marker=true for review, marker=false to clean up over the same link.
name: preview
on:
  workflow_dispatch:
    inputs:
      marker:
        description: Show the lane marker (true for review, false for clean-up)
        type: boolean
        required: true
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  preview:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.14.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --no-frozen-lockfile
      - name: Save /digest/2026-10-28 as one HTML file
        env:
          LANE_MARKER: ${{ inputs.marker && vars.LANE_MARKER || '' }}
          PORT: 8787
        run: |
          pnpm start > rig.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8787/health >/dev/null && break; sleep 1; done
          mkdir -p _site
          curl -sf localhost:8787/digest/2026-10-28 -o _site/index.html
          grep -o '<span class="marker">[^<]*</span>' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
